name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy
        id: trigger
        run: |
          # 201: deploy_id가 body에 있음. 202: 이미 진행 중인 deploy가 있어 별도 객체 없이 수락됨.
          # 둘 다 성공으로 처리한다. deploy_id가 없으면 GET /deploys로 최신 것을 가져온다.
          for attempt in 1 2 3; do
            RESPONSE=$(curl -sS -X POST \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              -w $'\n%{http_code}')

            HTTP_STATUS=$(printf '%s' "$RESPONSE" | tail -n1)
            BODY=$(printf '%s' "$RESPONSE" | sed '$d')

            echo "Attempt $attempt: HTTP $HTTP_STATUS"

            case "$HTTP_STATUS" in
              401|403)
                echo "::error::Render API 인증 실패 (HTTP $HTTP_STATUS). RENDER_API_KEY를 확인하세요."
                exit 1
                ;;
              5*)
                echo "Render API 서버 오류 (HTTP $HTTP_STATUS): $BODY"
                if [ "$attempt" -lt 3 ]; then sleep 10; fi
                continue
                ;;
              201|202)
                # 201이면 body에서 id 추출, 202면 GET으로 최신 deploy_id 조회
                DEPLOY_ID=$(printf '%s' "$BODY" | python3 -c \
                  'import sys,json; raw=sys.stdin.read().strip(); d=json.loads(raw) if raw.startswith("{") else {}; print(d.get("id","") if isinstance(d,dict) else "")' \
                  2>/dev/null || true)

                if [ -z "$DEPLOY_ID" ]; then
                  echo "deploy_id not in POST body (HTTP $HTTP_STATUS), fetching latest deploy..."
                  DEPLOY_ID=$(curl -sS \
                    "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys?limit=1" \
                    -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
                    | python3 -c \
                    'import sys,json; deploys=json.load(sys.stdin); print(deploys[0]["deploy"]["id"] if deploys and "deploy" in deploys[0] else "")' \
                    2>/dev/null || true)
                fi

                if [ -n "$DEPLOY_ID" ]; then
                  echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
                  echo "Deploy triggered: $DEPLOY_ID"
                else
                  echo "::warning::deploy_id를 확인할 수 없습니다. 배포는 진행 중일 수 있습니다."
                  echo "deploy_id=" >> "$GITHUB_OUTPUT"
                fi
                exit 0
                ;;
              *)
                echo "Unexpected response (HTTP $HTTP_STATUS): $BODY"
                if [ "$attempt" -lt 3 ]; then sleep 5; fi
                ;;
            esac
          done

          echo "::error::Render 배포 트리거에 3회 모두 실패했습니다."
          exit 1

      - name: Wait for deploy to go live
        run: |
          DEPLOY_ID="${{ steps.trigger.outputs.deploy_id }}"

          if [ -z "$DEPLOY_ID" ]; then
            echo "deploy_id 없음 — 배포 상태를 추적할 수 없습니다. Render 대시보드에서 확인하세요."
            exit 0
          fi

          FAILED_STATUSES="deactivated build_failed update_failed canceled"

          for i in $(seq 1 40); do
            STATUS=$(curl -sf \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            echo "[$i/40] status: $STATUS"

            if [ "$STATUS" = "live" ]; then
              echo "Deploy succeeded."
              exit 0
            fi

            for fs in $FAILED_STATUSES; do
              if [ "$STATUS" = "$fs" ]; then
                echo "Deploy failed with status: $STATUS"
                exit 1
              fi
            done

            sleep 15
          done

          echo "Deploy timed out (10 min)."
          exit 1
