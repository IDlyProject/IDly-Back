name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy
        id: trigger
        run: |
          for attempt in 1 2 3; do
            RESPONSE=$(curl -sS -X POST \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              -w "\n%{http_code}")

            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
            RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')
            DEPLOY_ID=$(echo "$RESPONSE_BODY" | python3 -c "import sys, json; s=sys.stdin.read().strip();\ntry:\n    data=json.loads(s) if s else {}\nexcept json.JSONDecodeError:\n    data={}\nprint(data.get('id',''))")

            if [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]] && [ -n "$DEPLOY_ID" ]; then
              echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
              echo "Triggered deploy: $DEPLOY_ID"
              exit 0
            fi

            echo "Attempt $attempt failed (HTTP $HTTP_STATUS)."
            if [ -n "$RESPONSE_BODY" ]; then
              echo "Response body: $RESPONSE_BODY"
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          echo "::error::Failed to trigger Render deploy after 3 attempts."
          exit 1

      - name: Wait for deploy to go live
        run: |
          DEPLOY_ID="${{ steps.trigger.outputs.deploy_id }}"
          FAILED_STATUSES="deactivated build_failed update_failed canceled"

          for i in $(seq 1 40); do
            STATUS=$(curl -sf \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            echo "[$i/40] status: $STATUS"

            if [ "$STATUS" = "live" ]; then
              echo "Deploy succeeded."
              exit 0
            fi

            for fs in $FAILED_STATUSES; do
              if [ "$STATUS" = "$fs" ]; then
                echo "Deploy failed with status: $STATUS"
                exit 1
              fi
            done

            sleep 15
          done

          echo "Deploy timed out (10 min)."
          exit 1
